name: Build Kept

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The release key lives only in these secrets (never in the repo). See docs/DEVELOPING.md.
      KEPT_KEYSTORE_BASE64: ${{ secrets.KEPT_KEYSTORE_BASE64 }}
      KEPT_KEYSTORE_PASSWORD: ${{ secrets.KEPT_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unpack the release key
        run: |
          if [ -n "$KEPT_KEYSTORE_BASE64" ]; then
            echo "$KEPT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kept-release.p12"
            echo "KEPT_KEYSTORE_FILE=$RUNNER_TEMP/kept-release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEPT_KEYSTORE_BASE64 is not set: the app is built and tested but not published."
          fi

      - name: Test and build
        run: |
          set -o pipefail
          # The run number is the build number (versionCode): it only grows, so each build is newer.
          gradle :core:parser:test :app:testDebugUnitTest :app:assembleRelease -PbuildNumber=${{ github.run_number }} --console=plain 2>&1 | tee build-log.txt

      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/log
          [ -f build-log.txt ] && cp build-log.txt /tmp/log/ || echo "no log" > /tmp/log/build-log.txt
          cd /tmp/log
          echo "${{ job.status }} ${{ github.sha }} run ${{ github.run_number }}" > status.txt
          grep -nE "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong|Could not|Golden set|  MISS|Tests run|tests completed" build-log.txt | head -300 > summary.txt || true
          tail -n 200 build-log.txt > tail.txt
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Build log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Publish release
        if: success() && env.KEPT_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="kept-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Notes for people installing Kept: the intro, this version's changelog section, how to install.
          awk -v v="## $VERSION" '$0 ~ "^## " { if (p) exit; if (index($0, v) == 1) { p = 1; next } } p' CHANGELOG.md > changes.md
          python3 - "$VERSION" "$APK" <<'PY'
          import sys
          version, apk = sys.argv[1], sys.argv[2]
          notes = open(".github/release-notes.md").read()
          notes = notes.replace("__VERSION__", version).replace("__APK__", apk).replace("__CHANGES__", open("changes.md").read().strip())
          open("notes.md", "w").write(notes)
          PY
          # The tag carries the build number, which the in-app updater compares.
          gh release create "v$VERSION-build-${{ github.run_number }}" "$APK" \
            --title "Kept $VERSION" \
            --notes-file notes.md \
            --latest
