name: Build Kept

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test parser and build app
        run: |
          set -o pipefail
          gradle :core:parser:test :app:assembleDebug --console=plain 2>&1 | tee build-log.txt

      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/log
          [ -f build-log.txt ] && cp build-log.txt /tmp/log/ || echo "no log" > /tmp/log/build-log.txt
          cd /tmp/log
          echo "${{ job.status }} ${{ github.sha }} run ${{ github.run_number }}" > status.txt
          grep -nE "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong|Could not|Golden set|  MISS|Tests run" build-log.txt | head -300 > summary.txt || true
          tail -n 200 build-log.txt > tail.txt
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Build log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Publish app for phone install
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kept-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" "kept-build-${{ github.run_number }}.apk" \
            --title "Kept test build ${{ github.run_number }}" \
            --notes "Debug build for testing. Tap the .apk below to download, then open it to install." \
            --prerelease
