name: Build Kept

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test parser and build app
        run: |
          set -o pipefail
          # The run number is the build number (versionCode): it only grows, so each build is newer.
          gradle :core:parser:test :app:testDebugUnitTest :app:assembleDebug -PbuildNumber=${{ github.run_number }} --console=plain 2>&1 | tee build-log.txt

      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/log
          [ -f build-log.txt ] && cp build-log.txt /tmp/log/ || echo "no log" > /tmp/log/build-log.txt
          cd /tmp/log
          echo "${{ job.status }} ${{ github.sha }} run ${{ github.run_number }}" > status.txt
          grep -nE "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong|Could not|Golden set|  MISS|Tests run|tests completed" build-log.txt | head -300 > summary.txt || true
          tail -n 200 build-log.txt > tail.txt
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Build log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Publish app for phone install
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token for the public kish523/kept-releases repo, which the app's updater reads.
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="kept-$VERSION-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          # Release notes: this version's section of CHANGELOG.md, then how to install.
          awk -v v="## $VERSION" '$0 ~ "^## " { if (p) exit; p = (index($0, v) == 1) } p' CHANGELOG.md > notes.md
          printf '\n---\nDebug build for testing. Tap the .apk below to download, then open it to install.\n' >> notes.md
          gh release create "v$VERSION-build-${{ github.run_number }}" "$APK" \
            --title "Kept $VERSION (test build ${{ github.run_number }})" \
            --notes-file notes.md \
            --prerelease
          # Also publish to the public releases repo, so installed apps can find and fetch the update.
          if [ -n "$RELEASES_TOKEN" ]; then
            GH_TOKEN="$RELEASES_TOKEN" gh release create "v$VERSION-build-${{ github.run_number }}" "$APK" \
              --repo kish523/kept-releases \
              --title "Kept $VERSION (build ${{ github.run_number }})" \
              --notes-file notes.md
          else
            echo "::warning::RELEASES_TOKEN is not set, so this build wasn't published to kish523/kept-releases (in-app updates won't see it)."
          fi
